
name: Refresh albums
on:
  schedule:
    - cron: "0 18 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch albums
        run: node scripts/fetch-album.mjs
        continue-on-error: true   # still commit whichever album succeeded
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add photos-*.json
          git diff --cached --quiet || (git commit -m "Update albums" && git push)
