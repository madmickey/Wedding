<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8f6f5f"><title>RSVP — Liz & Michael</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="stylesheet" href="css/styles.css">

</head><body><header class="site-header"><a class="brand" href="index.html">Liz & Michael</a><button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-navigation">☰</button><nav id="site-navigation" class="nav"><a href="index.html">Home</a><a href="photo-wall.html">Photo Wall</a><a href="accommodation.html">Accommodation</a><a href="local.html">Local Tips</a></nav></header>

<main class="page">

  <section class="section page-hero reveal">

    <p class="eyebrow">RSVP</p>

    <h1>Let us know if you can make it</h1>

    <div id="guestGreeting"></div>

    <iframe
      id="tallyFrame"
      width="100%"
      height="1200"
      frameborder="0"
      loading="lazy"
      style="border:none;">
    </iframe>

  </section>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const params = new URLSearchParams(window.location.search);

["guest_code", "guest_names", "num_kids", "num_adults"].forEach(key => {
    const value = params.get(key);
    if (value) {
        localStorage.setItem(key, value);
    }
});

const guestCode  = params.get("guest_code")  || localStorage.getItem("guest_code")  || "";
const guestNames = params.get("guest_names") || localStorage.getItem("guest_names") || "";
const numKids    = params.get("num_kids")    || localStorage.getItem("num_kids")    || "";
const numAdults  = params.get("num_adults")  || localStorage.getItem("num_adults")  || "";
	
    const greeting = document.getElementById("guestGreeting");

    if (guestNames) {
        greeting.innerHTML = `
            <div class="info-card" style="margin-bottom:2rem;">
                <p class="eyebrow">RSVP For</p>
                <h2>${guestNames}</h2>
            </div>

			<section class="card">
  
  <p>Please confirm your attendance for:</p>

  <p>
    💍 <strong>Michael & Liz's Wedding</strong><br>
    📅 Saturday 3 October 2026 · 2:00pm<br>
    📍 Bondi Scenic Lounge, Bondi Surf Life Saving Club
  </p>
</section>
        `;
    }

    const tallyUrl =
        "https://tally.so/embed/Gx7Q4Z" +
        "?alignLeft=1" +
        "&hideTitle=1" +
        "&transparentBackground=1" +
        "&dynamicHeight=1" +
        "&guest_code=" + encodeURIComponent(guestCode) +
        "&guest_names=" + encodeURIComponent(guestNames) +
        "&num_kids=" + encodeURIComponent(numKids) +
        "&num_adults=" + encodeURIComponent(numAdults);

    document.getElementById("tallyFrame").src = tallyUrl;

});
</script>
