  <style>
    /* Photo wall (scoped with pw- prefix so it can't clash with styles.css) */
    .pw-wall { columns: 4 220px; column-gap: 10px; margin-top: 18px; }
    .pw-wall button {
      display: block; width: 100%; margin: 0 0 10px; padding: 0; border: 0;
      background: #e9e2dd; border-radius: 10px; overflow: hidden;
      cursor: zoom-in; break-inside: avoid;
    }
    .pw-wall img {
      display: block; width: 100%; height: auto;
      opacity: 0; transition: opacity .4s, transform .3s;
    }
    .pw-wall img.loaded { opacity: 1; }
    .pw-wall button:hover img { transform: scale(1.03); }
    .pw-status { text-align: center; opacity: .7; padding: 24px 0; }
    .pw-album-link { text-align: center; margin-top: 14px; }

    .pw-lb {
      position: fixed; inset: 0; background: rgba(0,0,0,.92);
      display: none; align-items: center; justify-content: center; z-index: 1000;
    }
    .pw-lb.open { display: flex; }
    .pw-lb img { max-width: 92vw; max-height: 88vh; object-fit: contain; }
    .pw-lb button {
      position: absolute; background: none; border: 0; color: #fff;
      font-size: 2.5rem; cursor: pointer; padding: .3em .5em; opacity: .85;
    }
    .pw-lb button:hover { opacity: 1; }
    .pw-lb .pw-close { top: 8px; right: 12px; }
    .pw-lb .pw-prev { left: 8px; top: 50%; transform: translateY(-50%); }
    .pw-lb .pw-next { right: 8px; top: 50%; transform: translateY(-50%); }
    .pw-lb .pw-count {
      position: absolute; bottom: 12px; left: 0; right: 0;
      text-align: center; color: #fff; font-size: .9rem; opacity: .7;
    }
  </style>
</head>
